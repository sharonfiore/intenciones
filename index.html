<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Intenciones Parroquiales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de Navegación -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#">
        <i class="bi bi-book-half me-2"></i> Intenciones Parroquiales
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#" onclick="mostrarVista('dashboard')">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="mostrarVista('registro')">Registrar</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="mostrarVista('reportes')">Consultas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="container my-4">
    
    <!-- VISTA: Dashboard (Totalmente Rediseñada) -->
    <section id="dashboard">
        <h1 class="display-5 mb-4">Panel de Control</h1>
        <div class="row g-4">
            <!-- Columna Izquierda: Estadísticas y Acciones -->
            <div class="col-lg-8">
                <div class="row g-4">
                    <!-- Estadísticas -->
                    <div class="col-md-6">
                        <div class="glass-card stat-card h-100">
                            <div class="stat-icon"><i class="bi bi-calendar-heart"></i></div>
                            <div id="stat-today" class="stat-number">0</div>
                            <div class="stat-label">Intenciones para Hoy</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="glass-card stat-card h-100">
                            <div class="stat-icon"><i class="bi bi-calendar-week"></i></div>
                            <div id="stat-week" class="stat-number">0</div>
                            <div class="stat-label">Intenciones Próximos 7 Días</div>
                        </div>
                    </div>
                    <!-- Acciones Rápidas -->
                    <div class="col-12">
                        <div class="glass-card p-4">
                            <h5 class="mb-3">Acciones Rápidas</h5>
                            <button class="btn btn-primary btn-lg me-2" onclick="mostrarVista('registro', 'rapido')">
                                <i class="bi bi-lightning-fill me-1"></i> Registro Rápido
                            </button>
                            <button class="btn btn-secondary btn-lg" onclick="mostrarVista('registro', 'programado')">
                                <i class="bi bi-calendar-range me-1"></i> Programar Intención
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Columna Derecha: Misas del Día -->
            <div class="col-lg-4">
                <div class="glass-card h-100">
                    <div class="p-4">
                        <h5 class="mb-3"><i class="bi bi-clock-fill me-2"></i> Misas de Hoy</h5>
                        <div id="dashboard-misas-list">
                            <!-- Contenido dinámico desde JS -->
                            <p class="text-muted">Cargando misas...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- VISTA: Registro (Con clase .glass-card) -->
    <section id="registro" class="d-none">
        <div class="glass-card p-4">
            <h1 class="display-5 mb-4">Registro de Intenciones</h1>
            <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                <!-- Pestañas igual que antes -->
            </ul>
            <div class="tab-content" id="pills-tabContent">
                <!-- Formularios igual que antes -->
            </div>
        </div>
    </section>

    <!-- VISTA: Reportes y Consultas (Con clase .glass-card) -->
    <section id="reportes" class="d-none">
        <div class="glass-card p-4">
            <h1 class="display-5 mb-4">Consultas y Reportes</h1>
            <!-- Contenido igual que antes -->
        </div>
    </section>

  </main>

  <!-- Spinner de Carga (Loader) -->
  <div id="loader" class="d-none">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
