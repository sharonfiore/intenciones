<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Parroquial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="app-container">
        <!-- ===== BARRA LATERAL (SIDEBAR) ===== -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-book-half"></i>
                <span>Sistema Parroquial</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-link active" data-view="dashboard">
                    <i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span>
                </a>
                <a href="#" class="nav-link" data-view="tabla">
                    <i class="bi bi-table"></i><span>Consultas</span>
                </a>
                <a href="#" class="nav-link" data-view="calendario">
                    <i class="bi bi-calendar3"></i><span>Calendario</span>
                </a>
                <a href="#" class="nav-link" data-view="registro">
                    <i class="bi bi-pencil-square"></i><span>Registrar Intención</span>
                </a>
            </nav>
        </aside>

        <!-- ===== CONTENIDO PRINCIPAL (Aquí es donde el JS trabajará) ===== -->
        <main class="main-content">
            <section id="dashboard" class="view"></section>
            <section id="tabla" class="view"></section>
            <section id="calendario" class="view"></section>
            <section id="registro" class="view"></section>
        </main>
    </div>

    <!-- Loader (Pantalla de Carga) -->
    <div id="loader" class="d-none">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <!-- ===== MODAL DE EDICIÓN (AÑADIR ESTO) ===== -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Intención</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editRowId">
                        <div class="mb-3">
                            <label for="editIntencion" class="form-label">Intención (Nombre)</label>
                            <input type="text" class="form-control" id="editIntencion" required>
                        </div>
                        <div class="mb-3">
                            <label for="editNota" class="form-label">Nota (Opcional)</label>
                            <input type="text" class="form-control" id="editNota">
                        </div>
                        <div class="mb-3">
                            <label for="editCategoria" class="form-label">Categoría</label>
                            <select id="editCategoria" class="form-select" required>
                                <option value="En Acción de Gracias">En Acción de Gracias</option>
                                <option value="Por la Salud de">Por la Salud de</option>
                                <option value="Por la Vida y la Salud">Por la Vida y la Salud</option>
                                <option value="Por el Alma de">Por el Alma de</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveEditButton">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteGroupModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Esta es una intención programada. ¿Qué deseas eliminar?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="deleteSingleBtn">Eliminar solo esta</button>
                    <button type="button" class="btn btn-danger" id="deleteAllBtn">Eliminar toda la serie</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== NUEVO: MODAL DE DETALLES DEL CALENDARIO ===== -->
    <div class="modal fade" id="calendarDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="calendarDetailModalTitle">Detalles del Día</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="calendarDetailModalBody">
                    <!-- El contenido se generará dinámicamente aquí -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Librería para el Calendario -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script src="script.js"></script>
</body>
</html>
