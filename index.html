<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Parroquial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-book-half"></i>
                <span>Sistema Parroquial</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-link active" data-view="dashboard">
                    <i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span>
                </a>
                <a href="#" class="nav-link" data-view="tabla">
                    <i class="bi bi-table"></i><span>Tabla de Registros</span>
                </a>
                <a href="#" class="nav-link" data-view="calendario">
                    <i class="bi bi-calendar3"></i><span>Calendario</span>
                </a>
                <a href="#" class="nav-link" data-view="registro">
                    <i class="bi bi-pencil-square"></i><span>Registrar Intención</span>
                </a>
            </nav>
        </aside>
      
  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">
    
    <!-- VISTA: Dashboard (Totalmente Rediseñada) -->
    <section id="dashboard" class="view active">
        <h1 class="display-5 mb-4">Panel de Control</h1>
        <div class="row g-4">
            <!-- Columna Izquierda: Estadísticas y Acciones -->
            <div class="col-lg-8">
                <div class="row g-4">
                    <!-- Estadísticas -->
                    <div class="col-md-6">
                        <div class="glass-card stat-card h-100">
                            <div class="stat-icon"><i class="bi bi-calendar-heart"></i></div>
                            <div id="stat-today" class="stat-number">0</div>
                            <div class="stat-label">Intenciones para Hoy</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="glass-card stat-card h-100">
                            <div class="stat-icon"><i class="bi bi-calendar-week"></i></div>
                            <div id="stat-week" class="stat-number">0</div>
                            <div class="stat-label">Intenciones Próximos 7 Días</div>
                        </div>
                    </div>
                    <!-- Acciones Rápidas -->
                    <div class="col-12">
                        <div class="glass-card p-4">
                            <h5 class="mb-3">Acciones Rápidas</h5>
                            <button class="btn btn-primary btn-lg me-2" onclick="mostrarVista('registro', 'rapido')">
                                <i class="bi bi-lightning-fill me-1"></i> Registro Rápido
                            </button>
                            <button class="btn btn-secondary btn-lg" onclick="mostrarVista('registro', 'programado')">
                                <i class="bi bi-calendar-range me-1"></i> Programar Intención
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Columna Derecha: Misas del Día -->
            <div class="col-lg-4">
                <div class="glass-card h-100">
                    <div class="p-4">
                        <h5 class="mb-3"><i class="bi bi-clock-fill me-2"></i> Misas de Hoy</h5>
                        <div id="dashboard-misas-list">
                            <!-- Contenido dinámico desde JS -->
                            <p class="text-muted">Cargando misas...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- VISTA: Registro (Con clase .glass-card) -->
    <section id="registro" class="d-none">
        <div class="glass-card p-4">
            <h1 class="display-5 mb-4">Registro de Intenciones</h1>
            <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                <!-- Pestañas igual que antes -->
            </ul>
            <div class="tab-content" id="pills-tabContent">
                <!-- Formularios igual que antes -->
            </div>
        </div>
    </section>

    <!-- VISTA: Tabla de Registros -->
    <section id="tabla" class="view">
        <!-- Contenido generado por JS -->
    </section>

    <!-- VISTA: Calendario -->
    <section id="calendario" class="view">
         <div class="card p-4">
            <h2 class="view-title">Calendario de Intenciones</h2>
            <div id="calendar-container"></div>
         </div>
    </section>

    <!-- VISTA: Registro -->
    <section id="registro" class="view">
        <!-- El formulario de registro que ya conoces, ahora dentro de esta estructura -->
    </section>
    
    <!-- VISTA: Reportes y Consultas (Con clase .glass-card) -->
    <section id="reportes" class="d-none">
        <div class="glass-card p-4">
            <h1 class="display-5 mb-4">Consultas y Reportes</h1>
            <!-- Contenido igual que antes -->
        </div>
    </section>
  </main>

  <!-- Spinner de Carga (Loader) -->
  <div id="loader" class="d-none">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- FullCalendar JS (para el calendario) -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
  <script src="script.js"></script>
</body>
</html>
